<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô phỏng Chaos Game IFS Attractor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX for rendering mathematical formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <style>
    /* Tuỳ biến thanh cuộn mượt mà */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1f2937;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur px-6 py-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 via-rose-500 to-amber-500 flex items-center justify-center font-bold text-white shadow-lg shadow-purple-500/20">
          IFS
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 via-purple-300 to-amber-400">
            Hệ Hàm Co (IFS) - Chaos Game Attractor
          </h1>
          <p class="text-xs text-gray-400">Thuật toán Trò chơi Hỗn loạn vẽ Fractal tự đồng dạng</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs text-gray-400 bg-gray-800/80 px-3 py-1.5 rounded-full border border-gray-700">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        Trạng thái: <span id="status-badge" class="font-semibold text-emerald-400">Đang chạy</span>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- Left Column: Canvas Viewport -->
    <div class="lg:col-span-7 xl:col-span-8 flex flex-col gap-4">
      <div class="relative bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-2xl flex flex-col items-center justify-center">
        <!-- Canvas wrapper with fixed aspect-ratio -->
        <div class="w-full max-w-[620px] aspect-square relative rounded-xl overflow-hidden border border-gray-800/80 shadow-inner bg-[#0a0f1d]">
          <canvas id="chaosCanvas" class="w-full h-full block cursor-crosshair"></canvas>
          
          <!-- Lưới tọa độ overlay nhỏ -->
          <div class="absolute bottom-2 left-3 text-[10px] font-mono text-gray-500 select-none pointer-events-none">
            Gốc (0, 0)
          </div>
          <div class="absolute top-2 right-3 text-[10px] font-mono text-gray-500 select-none pointer-events-none">
            (1.0, 1.0)
          </div>
        </div>

        <!-- Thông số nhanh dưới Canvas -->
        <div class="w-full max-w-[620px] mt-4 grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
          <div class="bg-gray-800/60 p-2.5 rounded-xl border border-gray-800">
            <div class="text-gray-400">Điểm đã vẽ</div>
            <div id="statTotalPoints" class="font-mono text-sm md:text-base font-bold text-cyan-400 mt-0.5">0</div>
          </div>
          <div class="bg-gray-800/60 p-2.5 rounded-xl border border-gray-800">
            <div class="text-gray-400">Tốc độ (fps)</div>
            <div id="statFps" class="font-mono text-sm md:text-base font-bold text-emerald-400 mt-0.5">60</div>
          </div>
          <div class="bg-gray-800/60 p-2.5 rounded-xl border border-gray-800">
            <div class="text-gray-400">Tọa độ x hiện tại</div>
            <div id="statCurrX" class="font-mono text-sm md:text-base font-bold text-amber-400 mt-0.5">0.000</div>
          </div>
          <div class="bg-gray-800/60 p-2.5 rounded-xl border border-gray-800">
            <div class="text-gray-400">Tọa độ y hiện tại</div>
            <div id="statCurrY" class="font-mono text-sm md:text-base font-bold text-rose-400 mt-0.5">0.000</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column: Bảng điều khiển & Công thức Toán học -->
    <div class="lg:col-span-5 xl:col-span-4 flex flex-col gap-5">
      
      <!-- Bảng điều khiển -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
        <h2 class="text-base font-semibold text-gray-200 mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
          </svg>
          Điều Khiển Mô Phỏng
